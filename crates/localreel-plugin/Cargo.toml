[package]
name = "localreel-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sidecar plugin runtime and package format for LocalReel storage providers"
publish = false

[dependencies]
localreel-kernel = { path = "../localreel-kernel" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
walkdir.workspace = true
thiserror.workspace = true
zip.workspace = true
tracing.workspace = true
rusqlite.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile.workspace = true
walkdir.workspace = true

# A plugin runs in its own process, but "own process" is not an isolation
# guarantee: when the host dies the child must die with it. Windows gets a Job
# Object, Unix a process group; both need a platform binding.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"